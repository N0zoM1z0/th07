schema_version = 1
target_sha256 = "35467eaf8dc7fc85f024f16fb2037255f151cefda33cf4867bc9122aaa2e80ca"

# These are compiler-shaping recommendations learned from target-confirmed
# TH07 matches. They are hypotheses for the next probe, never acceptance
# evidence and never automatic source rewrites.

[[rules]]
id = "vc7-movzx-explicit-narrowing"
requires = ["movzx"]
confidence = "observed_pattern"
recommendation = "Use an explicit u8/u16 cast at the source boundary when VC7 must emit movzx; enum and mask expressions otherwise tend to stay 32-bit."
evidence = "Controller 0x004302F0 and 0x00430370 exact matches"

[[rules]]
id = "vc7-movsx-signed-narrowing"
requires = ["movsx"]
confidence = "compiler_rule"
recommendation = "Preserve a signed i8/i16 source type or explicit cast; replacing it with an unsigned field changes movsx to movzx."
evidence = "x86 operand semantics and VC7 probe behavior"

[[rules]]
id = "vc7-fastcall-register-homes"
requires = ["register_home"]
confidence = "observed_pattern"
recommendation = "Declare the receiver/register arguments in target order and shape locals before changing behavior; VC7 debug register homes strongly constrain the first stack slots."
evidence = "Controller and BulletManager debug-profile probes"

[[rules]]
id = "vc7-global-this-receiver"
requires = ["global_ecx_receiver"]
confidence = "observed_pattern"
recommendation = "Model the observed image address as the actual global object receiver instead of calling the member through the current this pointer."
evidence = "Player kill/laser 0x0043E260 and 0x0043E6B0 exact matches"

[[rules]]
id = "vc7-global-member-call-abi"
requires = ["global_ecx_receiver", "call_cleanup_mismatch"]
confidence = "instruction_fact"
recommendation = "When target loads a fixed global address into ECX before a call and performs no caller stack cleanup, declare the callee as a member of that global overlay; do not preserve a convenient cdecl/free-function prototype merely because its destination address is known."
evidence = "Player::ScoreGraze 0x0043EB90 calls 0x0042F4AA, 0x0042F789, and 0x0042F736 with ECX=0x00626270 and callee cleanup; correcting the three GrazeState member ABIs advanced strict comparison from +0x152 to +0x1D0"

[[rules]]
id = "vc7-qword-floating-constant"
requires = ["x87_f64"]
confidence = "instruction_fact"
recommendation = "Use a double literal/expression for an x87 qword memory operand; a float field or 0.0f produces a four-byte relocation and different comparison code."
evidence = "Player auxiliary collision 0x0043E0A0 exact qword-zero guard"

[[rules]]
id = "vc7-x87-positive-f32-threshold"
requires = ["x87_f32_threshold_c0_branch"]
confidence = "observed_pattern"
recommendation = "For a target `fld value; fcomp f32-constant; fnstsw ax; test ah, 1` threshold guard, express the accepted path as a positive `value >= constant` block before trying an inverted `continue`; VC7 then preserves the target's C0-only branch form. Retain it only through strict comparison."
evidence = "ECL opcode-121 large-bullet search 0x00418120 reached strict exact 311/311 bytes and 67/67 instructions with the positive threshold block; the equivalent inverted form emitted a different x87 branch sequence."

[[rules]]
id = "vc7-nonfolded-idiv"
requires = ["idiv"]
confidence = "observed_pattern"
recommendation = "If target preserves a divisor in ESI/EDI, a literal C division may constant-fold; probe a value sourced through a real local/field while preserving semantics."
evidence = "Player graze and spell finish target code"

[[rules]]
id = "vc7-frame-var-order"
requires = ["frame_mismatch"]
confidence = "observed_pattern"
recommendation = "Hold behavior constant and tune declarations/lifetimes or #pragma var_order; the frame delta is compiler-shaping evidence, not justification for padding arrays."
evidence = "TH07 matching workflow exact cases"

[[rules]]
id = "vc7-topology-exact-stack-shift"
requires = ["instruction_topology_exact", "stack_slot_shift"]
confidence = "observed_pattern"
recommendation = "When the normalized instruction topology is complete but EBP slot pairs differ, hold semantics and control flow constant; tune real local declaration order, scope, and #pragma var_order until the receiver home and named slots align. The topology abstraction cannot validate constants or relocations."
evidence = "Player::OnUpdate 0x0043EE50 reached all 1408 target instruction shapes before its final receiver-home/local-order adjustment, then became strict exact 6790/6790 bytes"

[[rules]]
id = "zun-shared-label-branch-target"
requires = ["instruction_topology_exact", "branch_target_mismatch"]
confidence = "observed_pattern"
recommendation = "When instruction topology and sizes align but an internal jump reaches a different instruction index, inspect source-level continue/break/goto and switch fallthrough before changing expressions or ABI. Reuse the target's real shared cleanup/advance label."
evidence = "BulletManager::OnUpdate 0x00425A50 had 999/999 aligned instruction shapes but three Clear paths used C++ continue and skipped the target's shared bullet-advance label; replacing them with the target-backed advance edge produced strict exact 4237/4237 bytes"

[[rules]]
id = "zun-direct-boolean-materialization"
requires = ["boolean_materialization", "register_home"]
confidence = "observed_pattern"
recommendation = "When target materializes a condition as 0/1 (through setcc or a branch diamond) and then tests it, A/B the direct boolean or explicit `condition ? 1 : 0` source expression before introducing a named flag local; VC7 often gives a named flag a different stack slot and shifts the receiver home. Retain the form only through canonical strict comparison."
evidence = "BulletManager::DeletedCallback 0x00427620 became strict exact 116/116 when an explicit shouldReleaseAnm local was replaced by the direct conjunction; PlayerBomb::BeginBomb 0x004409F0 and DrawBomb 0x004420B0 independently became strict exact with target-observed explicit boolean materialization"

[[rules]]
id = "vc7-object-tail-short"
requires = ["object_tail_short"]
confidence = "workflow_rule"
recommendation = "Inspect missing target side effects and branch forms before adding compiler-only shaping; a shorter tail usually means behavior is still absent."
evidence = "TH07 matching workflow"

[[rules]]
id = "vc7-object-tail-long"
requires = ["object_tail_long"]
confidence = "workflow_rule"
recommendation = "Look for redundant temporaries, repeated loads, or non-target cleanup before changing ABI or target-observed behavior."
evidence = "TH07 matching workflow"

[[rules]]
id = "zun-local-size-pragma"
requires = ["adjacent_size_pragma", "unoptimized_tail_near"]
confidence = "observed_pattern"
recommendation = "When adjacent ZUN source brackets the routine with #pragma optimize(\"s\", on), probe that source-local pragma before inventing temporaries or a translation-unit profile; keep the pragma bounded and require strict comparison."
evidence = "Timer 0x00439401 206->198, 0x004394C7 206->198, and 0x0043958D 116->110 became strict exact only under the bounded size pragma"

[[rules]]
id = "vc7-g6-word-bitfield"
requires = ["word_bitfield_mask", "profile_mismatch"]
confidence = "observed_pattern"
recommendation = "When target clears or sets a u16 bitfield through 66 25/66 83 and a G5 probe selects byte 24/80, test the canonical no-GS G6 profile before changing the field layout or source expression."
evidence = "ChainElem 0x0042FAB0, Chain::CreateElem 0x00430090, and Chain::Cut 0x00430140 all became strict exact when the existing source moved from G5 to G6"

[[rules]]
id = "vc7-op-int-to-float-spill"
requires = ["x87_int_to_float_return", "frame_mismatch", "object_tail_long"]
confidence = "observed_pattern"
recommendation = "If target returns integer-backed float switch arms with direct fild but the object stores and reloads conversion temporaries, A/B an otherwise-identical profile without /Op before changing the source or ABI."
evidence = "AnmVm::GetFloatVar 0x00450A50 changed from 249 bytes/frame 0x20 to strict exact 166 bytes/frame 0x08 when only /Op was removed; three sibling helpers remained exact"

[[rules]]
id = "zun-adjacent-distinct-branch-locals"
requires = ["frame_mismatch", "adjacent_named_locals", "equal_object_tail"]
confidence = "observed_pattern"
recommendation = "When adjacent ZUN source keeps same-typed results in separate mutually exclusive branch locals, preserve both declarations and the inner retry lifetime before var_order shaping; coalescing them can shrink the frame while leaving the tail deceptively equal."
evidence = "Controller::GetControllerInput 0x004303F0 required distinct WinMM/DirectInput shot results and scoped retry count before target var_order yielded strict exact 1488 bytes"

[[rules]]
id = "zun-legacy-type-local-hole"
requires = ["frame_mismatch", "unaccessed_dword_slot", "adjacent_type_flow_local"]
confidence = "observed_pattern"
recommendation = "If an otherwise target-complete ZUN resolver is one dword short, the target frame has an unaccessed named slot, and adjacent source carries a real value/type-flow local for the same resolver family, retain a semantically named legacy local in var_order; never generalize this to anonymous filler or arrays."
evidence = "ECL ResolveInt 0x0040E5B0 and ResolveFloat 0x0040EDF0 both moved from frame 0x30/first mismatch +5 to strict exact 1310 and 1178 bytes when the adjacent-supported legacy valueType local occupied the target's sole unaccessed dword slot"
